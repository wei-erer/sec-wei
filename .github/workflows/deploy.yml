name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先装 pnpm，再让 setup-node 读它的缓存目录（顺序不能反，否则 setup-node 会报找不到 pnpm）
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 注意：Pages 需要在仓库 Settings → Pages 里手动开启一次
      # （GITHUB_TOKEN 没有管理员权限，无法自动创建 Pages 站点）

      - name: Install dependencies
        # 没用 --frozen-lockfile：本地 pnpm 版本可能和 CI 上的不一致
        # CI 上走官方 registry（比镜像快），本地开发仍然用 .npmrc 里的镜像
        #
        # --ignore-scripts：pnpm 11 默认严格模式，会把"依赖的构建脚本被忽略"当成错误退出。
        # esbuild / sharp 的二进制由各自的平台包（@esbuild/linux-x64、@img/sharp-linux-x64）提供，
        # 不需要跑 postinstall，所以这里直接全部跳过脚本。
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            export SITE_BASE=/
          else
            export SITE_BASE="/$REPO/"
          fi
          echo "SITE_BASE=$SITE_BASE"
          pnpm exec astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
